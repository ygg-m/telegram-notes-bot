# Rename `app` to something unique, or let `fly launch --no-deploy --copy-config` pick one.
app = "telegram-notes-bot"
primary_region = "gru"

[build]

[env]
  DB_PATH = "/data/notes.db"

[mounts]
  source = "data"
  destination = "/data"

# Long polling: no inbound HTTP service. Keep exactly one machine running
# (two pollers would fight over updates and SQLite lives on one volume).
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
